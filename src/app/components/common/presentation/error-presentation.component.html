<div class="absolute inset-0 flex items-center justify-center bg-white bg-opacity-70 z-10">
  <div class="text-center text-red-500">
    <p>{{ message() }}</p>
    <button
      (click)="retry.emit()"
      class="mt-2 px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600"
    >
      {{ retryText() }}
    </button>
  </div>
</div>
