<div class="relative w-full h-full min-h-full overflow-hidden block">
  <!-- 地図表示（ローディングとエラー表示も含む） -->
  <app-map-presentation
    [mapData]="mapData()"
    [loading]="loading()"
    [error]="error()"
    (mapClick)="handleMapClick($event)"
    (retryLoad)="loadMapData()"
  ></app-map-presentation>
</div>
