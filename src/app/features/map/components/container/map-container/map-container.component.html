<div class="relative w-full h-full min-h-full overflow-hidden block">
  <!-- 地図表示（ローディングとエラー表示も含む） -->
  <app-map-view
    [mapData]="mapData()"
    [roadData]="roadData()"
    [roadPopup]="roadPopup()"
    [trafficData]="roadTrafficInfo()"
    [loading]="loading()"
    [error]="error()"
    [transform]="mapTransform()"
    (mapClick)="handleMapClick($event)"
    (retryLoad)="loadMapData()"
    (panEvent)="handlePan($event)"
    (zoomEvent)="handleZoom($event)"
    (boundsChange)="handleMapBoundsChange($event)"
    (initialTransformChange)="handleInitialTransformChange($event)"
    (canvasInfoChange)="handleCanvasInfoChange($event)"
  ></app-map-view>

  <!-- 交通コントロールパネル（時間選択と凡例） -->
  <div
    class="absolute bottom-4 left-1/2 transform -translate-x-1/2 z-10 w-[95%] sm:w-[800px] md:w-[900px] lg:w-[1000px] max-w-full"
  >
    <app-traffic-controls-container></app-traffic-controls-container>
  </div>
</div>
