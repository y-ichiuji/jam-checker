<div class="relative w-full h-full min-h-[400px] bg-gray-100">
  <!-- 読み込み中表示 -->
  @if (loading()) {
    <app-loading-view [message]="'地図データを読み込み中...'"></app-loading-view>
  }

  <!-- エラー表示 -->
  @if (error()) {
    <app-map-error-view
      [message]="error() || '地図データの取得に失敗しました'"
      (retry)="retryLoad.emit()"
    ></app-map-error-view>
  }

  <canvas #mapCanvas class="w-full h-full"></canvas>
</div>
