<div class="traffic-time-selector w-full mb-1">
  <div class="flex flex-col gap-4 w-full">
    <div class="flex justify-between items-center">
      <div class="text-sm font-medium">
        時間選択:
        <span class="font-bold ml-1">{{ formatHour(selectedHour()) }}</span>
      </div>

      <!-- アクセシビリティのための隠しコントロール -->
      <div class="sr-only">
        <label for="time-selector-input">時間選択（0から23まで）</label>
        <input
          id="time-selector-input"
          type="number"
          min="0"
          max="23"
          [value]="selectedHour()"
          (change)="onKeyboardInput($event)"
          aria-label="時間選択"
        />
      </div>

      <!-- キーボード操作用のヘルプテキスト -->
      <div class="text-xs text-gray-500">
        <span class="mr-2">←/→: 1時間ずつ変更</span>
        <button
          (click)="decrementHour()"
          class="px-2 py-1 bg-gray-100 hover:bg-gray-200 rounded text-gray-700"
          aria-label="1時間前へ"
        >
          -
        </button>
        <button
          (click)="incrementHour()"
          class="px-2 py-1 bg-gray-100 hover:bg-gray-200 rounded text-gray-700 ml-1"
          aria-label="1時間後へ"
        >
          +
        </button>
      </div>
    </div>

    <!-- Canvas要素 -->
    <div
      class="relative w-full h-16"
      role="slider"
      [attr.aria-valuemin]="0"
      [attr.aria-valuemax]="23"
      [attr.aria-valuenow]="selectedHour()"
      [attr.aria-valuetext]="formatHour(selectedHour())"
      aria-label="時間スライダー"
      tabindex="0"
      (keydown)="handleKeyDown($event)"
    >
      <canvas #timeCanvas class="w-full h-full cursor-pointer"></canvas>
    </div>
  </div>
</div>
