<div
  class="traffic-legend p-3 bg-white bg-opacity-95 rounded shadow"
  role="group"
  aria-label="交通状況凡例"
>
  <h3 class="text-xs font-medium mb-2 text-center">交通状況</h3>
  <div class="grid gap-2">
    @for (level of legendLevels; track level) {
      <div class="flex items-center gap-2">
        <div class="w-4 h-2 rounded" [style.background-color]="getColorForLevel(level)"></div>
        <span class="text-xs whitespace-nowrap">{{ getLabelForLevel(level) }}</span>
      </div>
    }
  </div>
</div>
