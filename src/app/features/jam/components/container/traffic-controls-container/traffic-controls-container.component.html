<div class="traffic-controls p-4 bg-white bg-opacity-90 rounded-lg shadow-lg">
  <div class="flex flex-col gap-4">
    <!-- レジェンド表示 -->
    <div>
      <app-traffic-legend></app-traffic-legend>
    </div>

    <!-- 時間選択コンポーネント -->
    <div>
      <app-traffic-time-selector
        [selectedHour]="selectedHour()"
        (hourChange)="handleHourChange($event)"
      >
      </app-traffic-time-selector>
    </div>

    <!-- ローディング表示 -->
    @if (loading()) {
      <div class="text-center text-sm text-blue-600">
        <span class="inline-block animate-spin mr-2">⟳</span>交通データ読込中...
      </div>
    }
  </div>
</div>
